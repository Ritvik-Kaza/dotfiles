[window]
opacity = 0.90
padding = { x = 10, y = 8 }
decorations = "none"

[font]
size = 11.0
normal = { family = "CaskaydiaMono Nerd Font", style = "Regular" }
bold   = { family = "CaskaydiaMono Nerd Font", style = "Bold" }

[colors.primary]
background = "#141416"
foreground = "#e9e9ec"

[colors.cursor]
text   = "#141416"
cursor = "#e9e9ec"

[colors.normal]
black   = "#1c1c1e"
red     = "#f28b8b"
green   = "#7ee2a8"
yellow  = "#f0c060"
blue    = "#8ab4f8"
magenta = "#c9a0f0"
cyan    = "#7fd4d4"
white   = "#e9e9ec"

[colors.bright]
black   = "#4a4a50"
red     = "#ffb3b3"
green   = "#a0f0c0"
yellow  = "#ffd98a"
blue    = "#aecdfb"
magenta = "#ddbaf8"
cyan    = "#a3e6e6"
white   = "#ffffff"
