$wallpaper = ~/Pictures/Wallpapers/wallpaper5.jpeg
$font = CaskaydiaMono Nerd Font

background {
    monitor =
    path = $wallpaper
    blur_passes = 3
    blur_size = 7
    noise = 0.01
    contrast = 0.9
    brightness = 0.75
    vibrancy = 0.15
}

general {
    hide_cursor = true
    grace = 2
}

label {
    monitor =
    text = cmd[update:1000] echo "$(date +'%-I:%M %p')"
    color = rgba(219, 230, 234, 1.0)
    font_size = 88
    font_family = $font
    position = 0, 60
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] echo "$(date +'%A, %B %-d')"
    color = rgba(107, 127, 135, 0.85)
    font_size = 18
    font_family = $font
    position = 0, -30
    halign = center
    valign = center
}

label {
    monitor =
    text = Hi there, $USER
    color = rgba(219, 230, 234, 0.9)
    font_size = 16
    font_family = $font
    position = 0, -100
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 260, 46
    outline_thickness = 1
    dots_size = 0.25
    dots_spacing = 0.3
    outer_color = rgba(79, 209, 197, 0.35)
    inner_color = rgba(79, 209, 197, 0.12)
    font_color = rgba(219, 230, 234, 0.9)
    fade_on_empty = false
    placeholder_text = <span foreground="##6b7f87">Enter password</span>
    hide_input = false
    rounding = 23
    position = 0, -150
    halign = center
    valign = center
    capslock_color = rgba(224, 79, 160, 0.9)
}

label {
    monitor =
    text = cmd[update:5000] echo "$(cat /sys/class/power_supply/BAT0/capacity 2>/dev/null || echo '--')%"
    color = rgba(219, 230, 234, 0.85)
    font_size = 13
    font_family = $font
    position = -30, -30
    halign = right
    valign = top
}
