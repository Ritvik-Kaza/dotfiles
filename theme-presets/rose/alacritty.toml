[window]
opacity = 1.0
padding = { x = 10, y = 8 }
decorations = "none"

[font]
size = 11.0
normal = { family = "CaskaydiaMono Nerd Font", style = "Regular" }
bold   = { family = "CaskaydiaMono Nerd Font", style = "Bold" }

[colors.primary]
background = "#141012"
foreground = "#ede6e8"

[colors.cursor]
text   = "#141012"
cursor = "#ede6e8"

[colors.normal]
black   = "#1c1719"
red     = "#e08a92"
green   = "#9bcf9f"
yellow  = "#d9a15c"
blue    = "#9badc9"
magenta = "#b6798c"
cyan    = "#8fc4c4"
white   = "#ede6e8"

[colors.bright]
black   = "#4a4144"
red     = "#f2a9ae"
green   = "#b8e0bc"
yellow  = "#f0c583"
blue    = "#bdd0e8"
magenta = "#cba0ac"
cyan    = "#b0dcdc"
white   = "#ffffff"
