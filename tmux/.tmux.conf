set -g default-command "${SHELL}"
# Change prefix from Ctrl-b to Ctrl-a (easier to reach)
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# Mouse support (scroll, click to switch panes, resize)
set -g mouse on

# Start windows/panes at 1, not 0
set -g base-index 1
setw -g pane-base-index 1

# Faster escape time (fixes vim/nvim lag inside tmux)
set -sg escape-time 0

# Increase scrollback buffer
set -g history-limit 10000

# Reload config with prefix + r
bind r source-file ~/.tmux.conf \; display "Config reloaded"

# Split panes using | and - (more intuitive than default % and ")
bind | split-window -h
bind - split-window -v
unbind '"'
unbind %

# Enable 256 color / true color support
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"

# Status bar styling
set -g status-bg colour235
set -g status-fg white
set -g status-left "#[fg=green]#S "
set -g status-right "#[fg=yellow]%H:%M"


bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9
